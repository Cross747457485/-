<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔮  Рулетка Судьбы</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 20px;
    background: linear-gradient(to bottom, #0f0c1b, #241442);
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

h1 {
    margin: 0 0 5px;
    color: #ff007f;
    font-size: 36px;
    text-align: center;
    text-shadow: 0 0 15px rgba(255,0,127,.7);
}

.subtitle {
    color: #b388ff;
    margin: 0 0 25px;
    text-align: center;
}

.roulette-container {
    position: relative;
    width: 320px;
    height: 320px;
    margin-bottom: 20px;
}

.pointer {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 30px solid #ff007f;
    z-index: 20;
    filter: drop-shadow(0 4px 5px black);
}

.wheel {
    position: relative;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    border: 6px solid white;
    overflow: hidden;
    box-shadow:
        0 0 25px rgba(123,44,191,.7),
        inset 0 0 20px rgba(0,0,0,.5);
    transition: transform 4.5s cubic-bezier(.1,.8,.1,1);
}

.wheel-text {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 135px;
    height: 30px;
    margin-top: -15px;
    transform-origin: 0 50%;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 8px;
    color: white;
    font-weight: bold;
    font-size: 14px;
    text-shadow: 2px 2px 4px black;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    pointer-events: none;
}

.spin-btn {
    position: absolute;
    z-index: 30;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 75px;
    height: 75px;
    border-radius: 50%;
    border: 4px solid #7b2cbf;
    background: white;
    color: #0f0c1b;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(0,0,0,.5);
}

.spin-btn:active {
    transform: translate(-50%, -50%) scale(.9);
}

.status-display {
    min-width: 220px;
    margin-bottom: 25px;
    padding: 10px 20px;
    border-radius: 20px;
    text-align: center;
    font-weight: bold;
    color: #fee440;
    background: rgba(255,255,255,.05);
    text-shadow: 0 0 10px rgba(254,228,64,.6);
}

.input-block {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.input-block label {
    margin-bottom: 10px;
    color: #e0aaff;
}

textarea {
    width: 100%;
    height: 100px;
    padding: 12px 20px;
    border: 2px solid #7b2cbf;
    border-radius: 15px;
    outline: none;
    resize: none;
    background: rgba(255,255,255,.05);
    color: white;
    font-size: 16px;
    font-family: Arial, sans-serif;
    text-align: center;
}

textarea:focus {
    border-color: #ff007f;
    box-shadow: 0 0 15px rgba(255,0,127,.4);
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    align-items: center;
    justify-content: center;
    background: rgba(15,12,27,.8);
    backdrop-filter: blur(5px);
}

.modal-content {
    width: 90%;
    max-width: 400px;
    padding: 30px;
    border: 2px solid #ff007f;
    border-radius: 20px;
    background: #1e1233;
    text-align: center;
    box-shadow: 0 0 30px rgba(255,0,127,.5);
}

.modal-content h2 {
    color: #b388ff;
}

.winner-text {
    margin: 20px 0;
    color: #fee440;
    font-size: 28px;
    font-weight: bold;
}

.close-modal-btn {
    padding: 10px 25px;
    border: none;
    border-radius: 25px;
    background: #ff007f;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

@media (max-width: 500px) {
    .roulette-container,
    .wheel {
width: 290px;
        height: 290px;
    }

    .wheel-text {
        width: 120px;
    }

    h1 {
        font-size: 28px;
    }
}
</style>
</head>

<body>

<h1>🔮  РУЛЕТКА СУДЬБЫ</h1>
<p class="subtitle">Введи варианты через Enter и крути!</p>

<div class="roulette-container">
    <div class="pointer"></div>
    <div class="wheel" id="wheel"></div>
    <button class="spin-btn" id="spinBtn">КРУТЬ</button>
</div>

<div class="status-display" id="statusDisplay">
    Жду твоих вариантов...
</div>

<div class="input-block">
    <label for="itemsInput">
        Варианты (каждый с новой строки):
    </label>

    <textarea id="itemsInput">Да
Нет
Возможно
Успех
Банкрот
Секретный приз</textarea>
</div>

<div class="modal" id="winnerModal">
    <div class="modal-content">
        <h2>🔮  Судьба выбрала:</h2>

        <div class="winner-text" id="winnerText"></div>

        <button class="close-modal-btn" id="closeModalBtn">
            Принять
        </button>
    </div>
</div>

<script>
const wheel = document.getElementById("wheel");
const spinBtn = document.getElementById("spinBtn");
const itemsInput = document.getElementById("itemsInput");
const statusDisplay = document.getElementById("statusDisplay");
const winnerModal = document.getElementById("winnerModal");
const winnerText = document.getElementById("winnerText");
const closeModalBtn = document.getElementById("closeModalBtn");

let rotation = 0;
let spinning = false;

const colors = [
    "#ff0055",
    "#00bbf9",
    "#00f5d4",
    "#9b5de5",
    "#f15bb5",
    "#fee440",
    "#3a86c8",
    "#ff9f1c",
    "#8338ec",
    "#06d6a0",
    "#ef476f",
    "#118ab2"
];

function getItems() {
    return itemsInput.value
        .split("\n")
        .map(x => x.trim())
        .filter(x => x.length > 0);
}

function drawWheel() {
    const items = getItems();

    wheel.innerHTML = "";

    if (items.length === 0) {
        wheel.style.background = "#333";
        statusDisplay.textContent = "Поле ввода пусто!";
        return;
    }

    const angle = 360 / items.length;

    let gradient = [];

    for (let i = 0; i < items.length; i++) {
        const start = i * angle;
        const end = (i + 1) * angle;

        gradient.push(
            `${colors[i % colors.length]} ${start}deg ${end}deg`
        );
    }

    wheel.style.background =
        `conic-gradient(${gradient.join(",")})`;

    items.forEach((item, i) => {
        const text = document.createElement("div");

        text.className = "wheel-text";
        text.textContent = item;

        const textAngle = i * angle + angle / 2;

        text.style.transform =
            `rotate(${textAngle}deg) translateX(8px)`;

        wheel.appendChild(text);
    });

    statusDisplay.textContent =
        `Добавлено вариантов: ${items.length}`;
}

itemsInput.addEventListener("input", drawWheel);

drawWheel();

spinBtn.addEventListener("click", () => {
    const items = getItems();

    if (items.length === 0) {
        alert("Введите варианты судьбы!");
        return;
    }

    if (spinning) return;

    spinning = true;
    statusDisplay.textContent = "Колесо крутится... 🌀 ";

    const sectorAngle = 360 / items.length;

    // Выбираем конкретный сектор
    const winnerIndex =
        Math.floor(Math.random() * items.length);

    // Центр выбранного сектора
    const winnerCenter =
        winnerIndex * sectorAngle + sectorAngle / 2;

    /*
       Стрелка находится сверху.
       Поэтому выбранный сектор ставим под неё.
    */
    const target =
        270 - winnerCenter;

    const current =
        rotation % 360;

    let difference =
        target - current;

    if (difference < 0) {
        difference += 360;
    }

    const extraSpins =
        (6 + Math.floor(Math.random() * 5)) * 360;

    rotation += extraSpins + difference;

    wheel.style.transform =
        `rotate(${rotation}deg)`;

    setTimeout(() => {
        spinning = false;

        const winner = items[winnerIndex];
statusDisplay.textContent =
            `Выпало: ${winner} 🎉 `;

        winnerText.textContent = winner;
        winnerModal.style.display = "flex";

    }, 4500);
});

closeModalBtn.addEventListener("click", () => {
    winnerModal.style.display = "none";
});

winnerModal.addEventListener("click", (event) => {
    if (event.target === winnerModal) {
        winnerModal.style.display = "none";
    }
});
</script>

</body>
</html>
