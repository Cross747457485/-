<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔮 Рулетка Судьбы</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0c1b;
            background: linear-gradient(to bottom, #0f0c1b, #241442);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            margin-bottom: 5px;
            color: #ff007f;
            text-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
            font-size: 2.5rem;
            text-align: center;
        }

        .subtitle {
            margin-bottom: 25px;
            color: #b388ff;
            text-align: center;
            font-size: 1.1rem;
        }

        /* Контейнер рулетки */
        .roulette-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin-bottom: 20px;
        }

        /* Розовая стрелочка указателя сверху */
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 28px solid #ff007f;
            z-index: 10;
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.7));
        }

        /* КОЛЕСО */
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px solid #fff;
            box-shadow: 0 0 25px rgba(123, 44, 191, 0.5), inset 0 0 20px rgba(0,0,0,0.6);
            background: conic-gradient(
                #ff0055 0deg 45deg, 
                #00bbf9 45deg 90deg, 
                #00f5d4 90deg 135deg, 
                #9b5de5 135deg 180deg, 
                #f15bb5 180deg 225deg,
                #fee440 225deg 270deg,
                #3a86c8 270deg 315deg,
                #ff9f1c 315deg 360deg
            );
            transition: transform 4.5s cubic-bezier(0.1, 0.8, 0.1, 1);
        }

        /* Кнопка Старт в центре */
        .spin-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75px;
            height: 75px;
            background: #fff;
            color: #0f0c1b;
            border-radius: 50%;
            border: 4px solid #7b2cbf;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            z-index: 5;
            transition: transform 0.1s;
        }

        .spin-btn:active {
            transform: translate(-50%, -50%) scale(0.9);
        }

        /* Неоновое табло для вывода текущего результата */
        .status-display {
            font-size: 1.3rem;
            font-weight: bold;
            color: #fee440;
            text-shadow: 0 0 10px rgba(254, 228, 64, 0.6);
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 25px;
            border-radius: 20px;
            border: 1px solid rgba(123, 44, 191, 0.3);
            margin-bottom: 25px;
            min-width: 200px;
            text-align: center;
        }

        /* Блок ввода вариантов под колесом */
        .input-block {
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
        }

        .input-block label {
            margin-bottom: 10px;
            color: #e0aaff;
            font-size: 1rem;
            text-align: center;
        }

        /* Поле ввода */
        .text-area-input {
            width: 100%;
            height: 100px;
            padding: 12px 20px;
            border: 2px solid #7b2cbf;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 16px;
            outline: none;
            text-align: center;
            transition: all 0.3s;
            box-sizing: border-box;
            resize: none;
            font-family: inherit;
        }

        .text-area-input:focus {
            border-color: #ff007f;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
        }

        /* Окно результатов */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 12, 27, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: #1e1233;
            border: 2px solid #ff007f;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.4);
            max-width: 400px;
            width: 90%;
        }

        .modal-content h2 {
            margin: 0 0 15px 0;
            color: #b388ff;
            font-size: 22px;
        }

        .winner-text {
            font-size: 28px;
            font-weight: bold;
            color: #fee440;
            text-shadow: 0 0 10px rgba(254, 228, 64, 0.6);
            margin-bottom: 25px;
        }

        .close-modal-btn {
            background: #ff007f;
            color: white;
            border: none;
            padding: 10px 25px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>🔮 РУЛЕТКА СУДЬБЫ</h1>
    <p class="subtitle">Введи варианты через Enter и крути!</p>

    <!-- Рулетка -->
    <div class="roulette-container">
        <div class="pointer"></div>
        <div class="wheel" id="wheel"></div>
        <button class="spin-btn" id="spinBtn">КРУТЬ</button>
    </div>

    <!-- Табло статуса -->
    <div class="status-display" id="statusDisplay">Жду твоих вариантов...</div>

    <!-- Блок ввода вариантов -->
    <div class="input-block">
        <label for="itemsInput">Варианты (каждый с новой строки):</label>
        <textarea id="itemsInput" class="text-area-input">Да
Нет
Возможно
Успех
Банкрот
Секретный приз</textarea>
    </div>

    <!-- Окно ответа -->
    <div class="modal" id="winnerModal">
        <div class="modal-content">
            <h2>🔮 Судьба выбрала:</h2>
            <div class="winner-text" id="winnerText">Вариант</div>
            <button class="close-modal-btn" id="closeModalBtn">Принять</button>
        </div>
    </div>

    <script>
        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spinBtn');
        const winnerModal = document.getElementById('winnerModal');
        const winnerText = document.getElementById('winnerText');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const itemsInput = document.getElementById('itemsInput');
        const statusDisplay = document.getElementById('statusDisplay');

        let currentRotation = 0;
        let isSpinning = false;

        // Показываем пользователю, сколько вариантов он ввел
        function updateStatus() {
            let items = itemsInput.value.split('\n').map(item => item.trim()).filter(item => item !== "");
            if (items.length === 0) {
                statusDisplay.innerText = "Поле ввода пусто!";
            } else {
                statusDisplay.innerText = `Добавлено вариантов: ${items.length}`;
            }
        }
        itemsInput.addEventListener('input', updateStatus);
        updateStatus();

        spinBtn.addEventListener('click', () => {
            let items = itemsInput.value.split('\n').map(item => item.trim()).filter(item => item !== "");
            
            if (items.length === 0) {
                alert("Введите варианты судьбы!");
                return;
            }
            if (isSpinning) return;

            isSpinning = true;
            statusDisplay.innerText = "Колесо крутится... 🌀";

            const randomDegrees = Math.floor(Math.random() * 360);
            const totalSpins = (6 + Math.floor(Math.random() * 5)) * 360;
            
            currentRotation += totalSpins + randomDegrees;
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;

                const actualDegrees = currentRotation % 360;
                const sectorAngle = 360 / items.length;
                
                // Высчитываем выигравший сектор
                const prizeIndex = Math.floor(((270 - actualDegrees + 360) % 360) / sectorAngle);

                const finalChoice = items[prizeIndex] || items[0];
                
                // Обновляем табло и открываем окно
                statusDisplay.innerText = `Выпало: ${finalChoice} 🎉`;
                winnerText.innerText = finalChoice;
                winnerModal.style.display = 'flex';
            }, 4500);
        });

        closeModalBtn.addEventListener('click', () => {
            winnerModal.style.display = 'none';
        });
    </script>
</body>
</html>
